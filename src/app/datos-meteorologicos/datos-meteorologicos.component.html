<div class="dm">
  <header class="dm__intro">
    <h1 class="dm__titulo">Datos y estadísticas</h1>
    <p class="dm__bajada">Elegí la estación y después lo que querés saber.</p>
  </header>

  <!-- La estación elegida acá es la activa: cada herramienta arranca con ella -->
  <section class="dm-estacion" aria-label="Estación para las herramientas">
    <mat-icon class="dm-estacion__icono" aria-hidden="true">location_on</mat-icon>
    <div class="dm-estacion__texto">
      <p class="dm-estacion__ayuda">Estación para todas las herramientas</p>
      <p class="dm-estacion__lugar" *ngIf="lugarActiva">{{ lugarActiva }}</p>
    </div>
    <app-selector-estacion class="dm-estacion__selector" etiqueta="Estación" appearance="outline"
      [estaciones]="estaciones" [ngModel]="activa" (cambio)="elegirEstacion($event)"></app-selector-estacion>
  </section>

  <!-- Herramientas según cuándo pasó lo que muestran: hoy, esta campaña y otros años -->
  <div class="dm-tiempo" aria-hidden="true">
    <span class="dm-tiempo__punto dm-tiempo__punto--hoy"></span>
    <span class="dm-tiempo__punto"></span>
    <span class="dm-tiempo__punto"></span>
  </div>

  <div class="dm-columnas">
    <section class="dm-grupo" *ngFor="let g of grupos; let gi = index" [attr.aria-labelledby]="'dm-grupo-' + gi">
      <h2 class="dm-grupo__titulo" [id]="'dm-grupo-' + gi">{{ g.titulo }}</h2>
      <p class="dm-grupo__desc">{{ g.descripcion }}</p>

      <ul class="dm-grupo__lista">
        <li *ngFor="let t of g.tarjetas">
          <button type="button" class="dm-pregunta" (click)="abrir(t)">
            <span class="dm-pregunta__texto">{{ t.pregunta }}</span>
            <span class="dm-pregunta__herramienta">
              {{ t.titulo }}<span class="dm-pregunta__nota" *ngIf="t.nota">{{ t.nota }}</span>
            </span>
          </button>
        </li>
      </ul>
    </section>
  </div>
</div>
