<div class="dm">
  <div class="dm__intro">
    <div>
      <div class="dm__eyebrow">CONSULTA PRINCIPAL</div>
      <h1 class="dm__headline">Herramientas de análisis y consulta meteorológica</h1>
    </div>
    <p class="dm__lead">Elegí una herramienta según lo que necesitás: lo que pasa ahora, cómo viene la campaña o la
      comparación con otros años y lugares.</p>
  </div>

  <!-- Herramientas agrupadas por uso; cada tarjeta indica si el dato es en vivo, histórico o un cálculo -->
  <section class="dm-grupo" *ngFor="let g of grupos; let gi = index" [attr.aria-labelledby]="'dm-grupo-' + gi">
    <header class="dm-grupo__head">
      <h2 class="dm-grupo__titulo" [id]="'dm-grupo-' + gi">{{ g.titulo }}</h2>
      <p class="dm-grupo__desc">{{ g.descripcion }}</p>
    </header>

    <div class="dm-grupo__grid">
      <button type="button" class="dm-tarjeta tap-feedback" *ngFor="let t of g.tarjetas" (click)="abrir(t)">
        <span class="dm-tarjeta__miniatura" aria-hidden="true">
          <img *ngIf="t.imagen; else icono" [src]="t.imagen" alt="" loading="lazy">
          <ng-template #icono><mat-icon>{{ t.icono }}</mat-icon></ng-template>
        </span>
        <span class="dm-tarjeta__texto">
          <span class="dm-tarjeta__tipo" [attr.data-tipo]="t.tipo">{{ t.tipo }}</span>
          <span class="dm-tarjeta__titulo">{{ t.titulo }}</span>
          <span class="dm-tarjeta__desc">{{ t.descripcion }}</span>
        </span>
        <mat-icon class="dm-tarjeta__flecha" aria-hidden="true">chevron_right</mat-icon>
      </button>
    </div>
  </section>
</div>
