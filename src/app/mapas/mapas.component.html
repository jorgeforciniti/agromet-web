<div class="dm">
  <div class="dm__main">
    <div class="dm__intro">
      <div class="dm__eyebrow">MAPAS</div>
      <h1 class="dm__headline">Mapas de la red de estaciones</h1>
      <p class="dm__lead">Lluvias, temperaturas y heladas registradas por las estaciones de la EEAOC, en el período que
        elijas.</p>
    </div>

    <div class="dm__grid">
      @for (mapa of mapas; track mapa.id; let i = $index) {
        <mat-card class="dm-card tap-feedback" [appScrollReveal]="i * 80">
          <button type="button" class="dm-card__media" (click)="abrir(mapa)" [attr.aria-label]="'Ver mapa de ' + mapa.titulo.toLowerCase()" tabindex="-1">
            <img class="dm-card__img" [src]="mapa.imagen" alt="" [attr.loading]="i === 0 ? null : 'lazy'" />
          </button>
          <mat-card-content class="dm-card__body">
            <h2 class="dm-card__title">{{ mapa.titulo }}</h2>
            <p class="dm-card__sub">{{ mapa.descripcion }}</p>
          </mat-card-content>
          <mat-card-actions class="dm-card__actions">
            <button mat-button class="dm-btn" (click)="abrir(mapa)">Ver mapa</button>
          </mat-card-actions>
        </mat-card>
      }
    </div>

    <!-- Lluvias máximas 24h: todavía no existe; volver a mostrarla como tarjeta cuando esté.
         Distribución de máximos diarios por localidad. -->
  </div>
</div>
