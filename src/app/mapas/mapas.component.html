<div class="mp">
  <header class="mp__intro">
    <h1 class="mp__titulo">Mapas</h1>
    <p class="mp__bajada">Lo que registró cada estación de la red, sobre el mapa de la provincia.</p>
  </header>

  <div class="mp-grupos">
    @for (g of grupos; track g.titulo; let gi = $index) {
      <section class="mp-grupo" [attr.aria-labelledby]="'mp-grupo-' + gi">
        <h2 class="mp-grupo__titulo" [id]="'mp-grupo-' + gi">
          <mat-icon aria-hidden="true">{{ g.icono }}</mat-icon>{{ g.titulo }}
        </h2>

        <ul class="mp-grupo__lista">
          @for (mapa of g.mapas; track mapa.id) {
            <li>
              <button type="button" class="mp-mapa" (click)="abrir(mapa)">
                <img class="mp-mapa__img" [src]="mapa.imagen" alt="" loading="lazy" />
                <span class="mp-mapa__texto">
                  <span class="mp-mapa__titulo">{{ mapa.titulo }}</span>
                  <span class="mp-mapa__periodo">{{ mapa.periodo }}</span>
                  <span class="mp-mapa__desc">{{ mapa.descripcion }}</span>
                </span>
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </div>

  <!-- Lluvias máximas 24h: todavía no existe; volver a mostrarla cuando esté.
       Distribución de máximos diarios por localidad. -->
</div>
