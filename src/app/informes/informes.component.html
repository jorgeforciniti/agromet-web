<section class="informes-section">
  <div class="informes-wrapper">
    <div class="informes-head">
      <div class="informes-eyebrow">BIBLIOTECA TÉCNICA</div>
      <h3 class="informes-title">Informes y publicaciones recientes</h3>
      <p class="informes-copy">Explorá boletines, reportes y documentos técnicos con filtros por temática y acceso
        rápido al PDF.</p>
    </div>

    <div class="filters" role="group" aria-label="Filtrar por tipo de informe">
      <button *ngFor="let tipo of tiposInformes" type="button" class="filter-chip"
        [class.filter-chip--active]="selectedCategoria === tipo.value" [style.--chipColor]="chipColor(tipo.value)"
        (click)="selectCategoria(tipo.value)">
        {{ tipo.viewValue }}
      </button>
    </div>

    <ul class="informes-list" *ngIf="loading" aria-hidden="true" aria-busy="true">
      <li class="informe-row" *ngFor="let i of [0,1,2,3,4,5]">
        <span class="skeleton sk-badge"></span>
        <span class="informe-row__main">
          <span class="skeleton sk-informe-title"></span>
          <span class="skeleton sk-informe-date"></span>
        </span>
        <span class="skeleton sk-informe-action"></span>
      </li>
    </ul>

    <ul class="informes-list" *ngIf="!loading && filteredDatos.length; else sinInformes">
      <li class="informe-row tap-feedback" [appScrollReveal]="0" *ngFor="let informe of filteredDatos">
        <span class="informe-badge" [style.--chipColor]="chipColor(informe.categoria)">
          {{ categoriaLabel(informe.categoria) }}
        </span>

        <button type="button" class="informe-row__main" (click)="openDialog(informe)">
          <h3 class="informe-row__title" [title]="informe.titulo">{{ informe.titulo }}</h3>
          <span class="informe-row__date">{{ informe.creado }}</span>
        </button>

        <button type="button" class="informe-row__action" (click)="openDialog(informe)">
          Ver PDF
          <mat-icon>arrow_outward</mat-icon>
        </button>
      </li>
    </ul>

    <ng-template #sinInformes>
      <p class="informes-empty" *ngIf="!loading">No hay informes disponibles para este filtro.</p>
    </ng-template>
  </div>
</section>
