<div class="auth-popup">
  <div class="auth-card">
    <img class="avatar" src="../../assets/images/auth/avatarplaceholder.png" alt="Avatar">
    <h2>{{ isLoginMode ? '¡Hola, invitado!' : 'Crear cuenta' }}</h2>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <input type="email" formControlName="email" placeholder="Correo electrónico" autocomplete="username">
      <input type="password" formControlName="password" placeholder="Contraseña" autocomplete="current-password">

      <button class="btn" type="submit">{{ isLoginMode ? 'Ingresar' : 'Registrarse' }}</button>
    </form>

    <button class="btn" (click)="loginWithGoogle()">Iniciar con Google</button>
    
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    
    <button class="toggle-btn" (click)="toggleMode()">
      {{ isLoginMode ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión' }}
    </button>

    <!-- ✅ Botón para cerrar manualmente la autenticación -->
    <button class="close-btn" (click)="close()">Cerrar</button>
  </div>
</div>
