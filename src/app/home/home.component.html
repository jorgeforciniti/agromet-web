<div class="home">
  <app-bienvenida></app-bienvenida>

  <app-mis-estaciones class="home-mis-estaciones"></app-mis-estaciones>

  <nav class="accesos" aria-label="Secciones del sitio">
    <section class="grupo" *ngFor="let g of grupos">
      <h2 class="grupo-titulo">{{ g.titulo }}</h2>
      <ul class="grupo-lista">
        <li *ngFor="let a of g.accesos">
          <a class="acceso" [routerLink]="a.ruta" [style.--color]="a.color">
            <mat-icon class="acceso-icono" aria-hidden="true">{{ a.icono }}</mat-icon>
            <span class="acceso-texto">
              <strong>{{ a.titulo }}</strong>
              <span>{{ a.descripcion }}</span>
            </span>
          </a>
        </li>
      </ul>
    </section>
  </nav>
</div>
