<mat-dialog-content>
  <div class="scroll-container" [formGroup]="form">
    <div class="dialog-body-wrapper">
      <h2 class="titulo">Mapa de Temperaturas</h2>

      <button type="button" class="close-btn" (click)="close()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
      </button>

      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Desde</mat-label>
          <input matInput [matDatepicker]="pickerDesde" formControlName="desde">
          <mat-datepicker-toggle matSuffix [for]="pickerDesde"></mat-datepicker-toggle>
          <mat-datepicker #pickerDesde></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Hasta</mat-label>
          <input matInput [matDatepicker]="pickerHasta" formControlName="hasta">
          <mat-datepicker-toggle matSuffix [for]="pickerHasta"></mat-datepicker-toggle>
          <mat-datepicker #pickerHasta></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Variable</mat-label>
          <mat-select formControlName="variable">
            <mat-option *ngFor="let v of variables" [value]="v.key">{{ v.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Mapa Base</mat-label>
          <mat-select formControlName="baseMap" (selectionChange)="onBaseMapChange()">
            <mat-option *ngFor="let bm of baseMapsList" [value]="bm.value">{{ bm.label }}</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button color="primary" (click)="loadData()" [disabled]="loading" class="search-button">
            <mat-icon *ngIf="!loading">map</mat-icon>
            <mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="18"></mat-progress-spinner>
            {{ loading ? 'Cargando...' : 'Cargar' }}
          </button>
        </div>
      </div>

      <div class="map-title">
        {{ currentVariableLabel }} - Período: {{ form.value.desde | date:'dd/MM/yyyy' }} a {{ form.value.hasta | date:'dd/MM/yyyy' }}
      </div>

      <div class="map-wrap">
        <div class="map-container" id="mapContainer">
          <div *ngIf="loading" class="map-loader-overlay">
            <mat-progress-spinner mode="indeterminate" diameter="50"></mat-progress-spinner>
            <span>Cargando datos...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
