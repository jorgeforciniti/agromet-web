<nav class="navbar">
  <a routerLink="/" class="logo">x</a>

  <div class="user-info" *ngIf="userEmail; else guest">

  <ng-template #guest>
    <button class="btn" (click)="openAuthDialog()">Iniciar Sesión</button> <!-- ✅ Cambiado a botón -->
  </ng-template>
</nav>
