<div class="bienvenida-wrapper">
  <div class="hero-container">
    <video #heroVideo class="hero-bg" autoplay muted loop playsinline preload="auto" poster="assets/images/fallback.jpg">
      <source src="assets/videos/inicio.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>

    <div class="hero-overlay">
      <div class="hero-eyebrow">MONITOREO AGROMETEOROLÓGICO</div>
      <h1 class="hero-title">Agrometeorología en tiempo real para Tucumán y el NOA</h1>
      <h2 class="hero-subtext">Bienvenidos a la sección Agrometeorología de la EEAOC.</h2>
      <p class="hero-subtext">Información climática de Tucumán para una agricultura más eficiente y mejor seguimiento territorial.</p>
      <div class="hero-cta">
        <button type="button" class="btn btn--accent" (click)="openDialog()">Saber más</button>
      </div>
    </div>
  </div>
</div>
