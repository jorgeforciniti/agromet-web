<mat-dialog-content class="comparison-dialog">
  <div class="scroll-container">
    <div class="dialog-header">
      <div class="dialogo-texto">
        <div class="dialogo-titulo">
          <h2 class="titulo">Comparar períodos entre años</h2>
          <span class="dialog-eyebrow">COMPARATIVA HISTÓRICA</span>
        </div>
      </div>

      <button type="button" class="close-btn" (click)="close()" aria-label="Cerrar diálogo">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-section">
      <div class="form-grid-compact">
        <app-selector-estacion formControlName="estacion" etiqueta="Estación"
          [estaciones]="stations"></app-selector-estacion>

        <mat-form-field appearance="fill">
          <mat-label>Desde</mat-label>
          <input matInput [matDatepicker]="dp1" formControlName="fechaDesde">
          <mat-datepicker-toggle matSuffix [for]="dp1"></mat-datepicker-toggle>
          <mat-datepicker #dp1></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Hasta</mat-label>
          <input matInput [matDatepicker]="dp2" formControlName="fechaHasta">
          <mat-datepicker-toggle matSuffix [for]="dp2"></mat-datepicker-toggle>
          <mat-datepicker #dp2></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Año de comparación</mat-label>
          <select matNativeControl formControlName="compYear">
            <option *ngFor="let y of comparisonYears" [value]="y">
              {{ y }}
            </option>
          </select>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Formato</mat-label>
          <select matNativeControl formControlName="formato">
            <option value="diario">Diario</option>
            <option value="decadico">Decádico</option>
            <option value="mensual">Mensual</option>
          </select>
        </mat-form-field>
      </div>

      <mat-radio-group formControlName="variable" class="vars-grid">
        <mat-radio-button *ngFor="let v of variables" [value]="v.key" class="radio-option">
          <span class="radio-label">{{ v.label }}</span>
        </mat-radio-button>
      </mat-radio-group>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit" class="search-button" [disabled]="isLoading">
          <mat-icon>search</mat-icon>
          Comparar
        </button>
      </div>
    </form>
    <app-copiar-enlace [enlace]="enlaceConsulta"></app-copiar-enlace>

    <div class="chart-section">
      <div class="chart-container" *ngIf="lineChartData.datasets.length">
        <app-exportar-grafico nombre="comparacion-anios" [maxFilas]="31"></app-exportar-grafico>
        <canvas baseChart [data]="lineChartData" [options]="chartOptions" [plugins]="pluginsGrafico"
          type="line"></canvas>
      </div>

      <div class="chart-container" *ngIf="barChartData.datasets.length">
        <app-exportar-grafico nombre="comparacion-anios" [maxFilas]="31"></app-exportar-grafico>
        <canvas baseChart [data]="barChartData" [options]="chartOptions" [plugins]="pluginsGrafico"
          type="bar"></canvas>
      </div>
      <p class="aviso-faltantes" *ngIf="textoFaltantes" role="status">
        <span><i class="muestra-sin-datos" aria-hidden="true"></i>Sin datos — {{ textoFaltantes }}</span>
        <span *ngIf="hayIncompletos"><i class="muestra-incompleto" aria-hidden="true"></i>Período incompleto: suma o promedio de los días con datos</span>
      </p>
    </div>

    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
  </div>
</mat-dialog-content>
