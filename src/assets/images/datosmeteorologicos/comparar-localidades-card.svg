<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Dos localidades comparadas: marcadores azul y naranja unidos sobre un mapa, con sus barras">
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ea"/>
      <stop offset="1" stop-color="#dcebc9"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#campo)"/>

  <!-- Parcelas y relieve suave -->
  <g opacity=".55">
    <path d="M0 70 L120 40 L170 110 L40 150 Z" fill="#cfe3b4"/>
    <path d="M170 110 L300 80 L300 190 L210 210 Z" fill="#c4dca6"/>
    <path d="M40 150 L170 110 L210 210 L70 250 Z" fill="#d9eac3"/>
  </g>
  <!-- Río -->
  <path d="M-10 214 C50 196 90 232 150 214 S250 180 310 196" fill="none" stroke="#9cc9e8" stroke-width="12" stroke-linecap="round"/>
  <path d="M-10 214 C50 196 90 232 150 214 S250 180 310 196" fill="none" stroke="#c9e4f5" stroke-width="4" stroke-linecap="round"/>
  <!-- Caminos -->
  <path d="M0 120 C80 110 130 140 300 128" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>

  <!-- Unión punteada entre las dos estaciones -->
  <path d="M82 118 C120 70 190 70 222 140" fill="none" stroke="#475467" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- Estación A (azul) -->
  <g filter="url(#sombra)">
    <path d="M82 132 C68 112 62 102 62 92 A20 20 0 0 1 102 92 C102 102 96 112 82 132 Z" fill="#2a78d6"/>
    <circle cx="82" cy="92" r="8" fill="#ffffff"/>
  </g>
  <!-- Estación B (naranja) -->
  <g filter="url(#sombra)">
    <path d="M222 154 C208 134 202 124 202 114 A20 20 0 0 1 242 114 C242 124 236 134 222 154 Z" fill="#eb6834"/>
    <circle cx="222" cy="114" r="8" fill="#ffffff"/>
  </g>

  <!-- Barras de cada estación -->
  <g filter="url(#sombra)">
    <rect x="22" y="222" width="256" height="62" rx="14" fill="#ffffff" opacity=".95"/>
  </g>
  <g>
    <rect x="40" y="256" width="14" height="18" rx="3" fill="#2a78d6"/>
    <rect x="58" y="248" width="14" height="26" rx="3" fill="#eb6834"/>
    <rect x="96" y="244" width="14" height="30" rx="3" fill="#2a78d6"/>
    <rect x="114" y="252" width="14" height="22" rx="3" fill="#eb6834"/>
    <rect x="152" y="238" width="14" height="36" rx="3" fill="#2a78d6"/>
    <rect x="170" y="242" width="14" height="32" rx="3" fill="#eb6834"/>
    <rect x="208" y="232" width="14" height="42" rx="3" fill="#2a78d6"/>
    <rect x="226" y="236" width="14" height="38" rx="3" fill="#eb6834"/>
  </g>
</svg>
